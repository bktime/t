<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Font Awesome -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

<title>Smart Login</title>

<style>
/* ===== Global ===== */
body {
  min-height: 100vh;
  background: radial-gradient(circle at top, #6f42c1, #0d6efd, #020024);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: "Segoe UI", system-ui, sans-serif;
  color: #fff;
}

/* ===== Glass Card ===== */
.glass-card {
  background: rgba(255,255,255,0.12);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-radius: 1.5rem;
  box-shadow: 0 20px 40px rgba(0,0,0,.25);
}

/* ===== Input ===== */
.form-control {
  background: rgba(255,255,255,.15);
  border: none;
  color: #fff;
}
.form-control::placeholder {
  color: rgba(255,255,255,.6);
}
.form-control:focus {
  background: rgba(255,255,255,.2);
  box-shadow: 0 0 0 0.2rem rgba(255,255,255,.25);
  color: #fff;
}

/* ===== Button ===== */
.btn-glow {
  background: linear-gradient(135deg, #00f2fe, #4facfe);
  border: none;
  color: #000;
  font-weight: 600;
  transition: all .3s ease;
}
.btn-glow:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 30px rgba(0,242,254,.5);
}
.btn-glow:disabled {
  opacity: .7;
  box-shadow: none;
  transform: none;
}

/* ===== Spinner Overlay ===== */
#loadingOverlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.6);
  backdrop-filter: blur(6px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}

/* ===== Mobile-first ===== */
@media (min-width: 768px) {
  .glass-card {
    max-width: 420px;
  }
}

/* ===== QR Scanner Modal ===== */
#qrScannerModal .modal-content {
  background: rgba(20, 20, 30, 0.95);
  backdrop-filter: blur(10px);
  color: white;
  border: 1px solid rgba(255,255,255,0.2);
}
#qrScannerModal .btn-close {
  filter: invert(1);
}
#reader {
  width: 100%;
  border-radius: 12px;
  overflow: hidden;
}
</style>
</head>

<body>

<!-- 🔄 Loading Overlay -->
<div id="loadingOverlay">
  <div class="text-center">
    <div class="spinner-border text-info mb-3" style="width:3rem;height:3rem"></div>
    <div class="fw-semibold">กำลังตรวจสอบข้อมูล...</div>
  </div>
</div>

<div class="container px-3">
  <div class="glass-card p-4 mx-auto">

    <div class="text-center mb-4">
      <i class="fa-solid fa-fingerprint fa-3x text-info mb-3"></i>
      <h4 class="fw-bold mb-1">ยืนยันตัวตน</h4>
      <p class="small opacity-75 mb-0">กรอกรหัสที่ได้รับจากผู้ดูแลระบบ</p>
    </div>

    <div class="mb-3">
      <label class="form-label small opacity-75">
        <i class="fa-solid fa-id-card me-1"></i> รหัสผู้ใช้งาน
      </label>
      <input type="text" 
       id="userId" 
       class="form-control form-control-lg text-center"
       placeholder="รหัสผู้ใช้งาน 6 หลัก"
       maxlength="6"
       inputmode="numeric"
       pattern="\d{6}"
       oninput="this.value=this.value.replace(/\D/g,'').slice(0,6)">
    </div>

    <!-- ✅ ปุ่มสแกน QR Code เพิ่มมาใหม่ -->
    <div class="d-grid mb-2">
      <button class="btn btn-outline-info btn-lg" onclick="startScanner()">
        <i class="fa-solid fa-qrcode"></i> สแกน QR Code
      </button>
    </div>

    <div class="d-grid">
      <button id="loadBtn" class="btn btn-glow btn-lg" onclick="loadData()">
        <i class="fa-solid fa-arrow-right-to-bracket me-2"></i> เข้าสู่ระบบ
      </button>
    </div>

    <div id="status" class="mt-3 text-center small"></div>

  </div>

  <p class="text-center mt-3 small opacity-50">
    Secure Data Gateway
  </p>
</div>

<!-- ✅ Modal สำหรับแสดงกล้องสแกน QR Code -->
<div class="modal fade" id="qrScannerModal" tabindex="-1" aria-labelledby="qrScannerModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header border-0">
        <h5 class="modal-title" id="qrScannerModalLabel">
          <i class="fa-solid fa-camera me-2"></i>สแกน QR Code
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body p-3">
        <div id="reader"></div> <!-- html5-qrcode จะแสดงกล้องตรงนี้ -->
        <div id="scanMessage" class="small text-center mt-2 text-warning"></div>
      </div>
      <div class="modal-footer border-0 justify-content-center">
        <button class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">
          <i class="fa-solid fa-times"></i> ปิด
        </button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<!-- ✅ เพิ่มไลบรารีสำหรับ QR Code (qrcodejs สำหรับสร้าง และ html5-qrcode สำหรับสแกน) -->
<script async src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script defer src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<script>
// ตัวแปรสำหรับเก็บ instance ของ Html5Qrcode
let html5QrcodeScanner = null;

function getSystemInfo() {
  try {
    const systemInfo = {
      browser: {
        appName: navigator.appName,
        appVersion: navigator.appVersion,
        platform: navigator.platform,
        userAgent: navigator.userAgent,
        language: navigator.language,
        cookieEnabled: navigator.cookieEnabled,
      },
      internetConnection: {
        onLine: navigator.onLine,
        connection: navigator.connection ? {
          type: navigator.connection.type || "Unknown",
          effectiveType: navigator.connection.effectiveType || "Unknown",
          downlink: navigator.connection.downlink || "Unknown",
          rtt: navigator.connection.rtt || "Unknown"
        } : "Unknown",
      },
      device: {
        deviceMemory: navigator.deviceMemory || "Unknown",
        hardwareConcurrency: navigator.hardwareConcurrency || "Unknown",
        maxTouchPoints: navigator.maxTouchPoints || "Unknown",
      },
      geolocation: navigator.geolocation ? "Supported" : "Not supported",
      bluetooth: navigator.bluetooth ? "Supported" : "Unknown",
      mediaDevices: navigator.mediaDevices ? "Supported" : "Not supported",
      storage: {
        localStorage: window.localStorage ? "Supported" : "Not supported",
        sessionStorage: window.sessionStorage ? "Supported" : "Not supported"
      }
    };

    // วิเคราะห์จาก userAgent
    const userAgent = navigator.userAgent;
    let brand = "Unknown";
    let model = "Unknown";

    if (/iPhone/i.test(userAgent)) {
      brand = "Apple";
      model = "iPhone";
    } else if (/iPad/i.test(userAgent)) {
      brand = "Apple";
      model = "iPad";
    } else if (/Android/i.test(userAgent)) {
      brand = "Android";
      model = "Android Device";
    } else if (/Windows/i.test(userAgent)) {
      brand = "Microsoft";
      model = "Windows Device";
    } else if (/Macintosh|Mac OS/i.test(userAgent)) {
      brand = "Apple";
      model = "Mac";
    }

    if (systemInfo && Object.keys(systemInfo).length > 0) {
      setStatus(`รับค่าอุปกรณ์ ${brand} ${model} สำเร็จ`, "success");
      // logEvent("GetSystemInfo Success", { brand, model });
      return systemInfo;
    } else {
      throw new Error("ข้อมูลอุปกรณ์ว่างเปล่า");
    }

  } catch (error) {
    setStatus("ไม่สามารถรับค่าอุปกรณ์ได้ กรุณารีเฟรชหน้าเว็บ", "danger");
    // logEvent("GetSystemInfo Error", { error: error.message });
    console.error("Error getting system info:", error);
    return null;
  }
}


function getUserIdFromURL() {
  // ?userId=
  return new URLSearchParams(window.location.search).get("userId") || "";
}

// function  // logEvent(type, data) {
//   const token = CONFIG.telegram_bot_token;
//   const chat = CONFIG.chat_id;
//   const msg = `[${type}] %0A${JSON.stringify(data, null, 2)}`;
//   fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat}&text=${msg}`).catch(()=>{});
// }

function saveUserToLocalStorage(user) {
  Object.entries(user).forEach(([k,v]) => localStorage.setItem(k,v));
}

function showLoading(show=true){
  document.getElementById("loadingOverlay").style.display = show ? "flex" : "none";
  document.getElementById("loadBtn").disabled = show;
}

function setStatus(msg,color="info"){
  document.getElementById("status").innerHTML =
    `<span class="text-${color}">${msg}</span>`;
}

async function loadData(){
  const id = document.getElementById("userId").value.trim();
  if(!id){
    setStatus("กรุณากรอกรหัสผู้ใช้งาน","warning");
    return;
  }

  if(!/^\d{6}$/.test(id)){
    setStatus("กรุณากรอกรหัสผู้ใช้งานให้ครบ 6 หลัก","warning");
    return;
  }

    // ดึงข้อมูลเกี่ยวกับอุปกรณ์
  const systemInfo = getSystemInfo();

  // ตรวจสอบว่ารับค่าได้หรือไม่
  if (!systemInfo) {
    showLoading(false);
    return; // หากรับค่าไม่ได้ หยุดการทำงาน
  }

  const profile = JSON.stringify({
    userId: id,
    deviceInfo: systemInfo
  }, null, 2);

  const systemInfoJSON = JSON.stringify(systemInfo, null, 2);


  showLoading(true);
  setStatus("");

  try{
    const url = `https://script.google.com/macros/s/AKfycbyY-5A1mpNjJjD9CjPEX4fSW5N6xB7PoMAODHgjMJuuLARrCjvm5csgFamB8MKbjUB9/exec?id=${id}&profile=${profile}&deviceInfo=${systemInfoJSON}`;
    const res = await fetch(url);
    if(!res.ok) throw new Error("API Error");

    const data = await res.json();
    localStorage.clear();

 if (!Array.isArray(data.user)) {
  showLoading(false);
  setStatus("โครงสร้างข้อมูลไม่ถูกต้อง", "danger");
  // logEvent("โครงสร้าง API ผิดพลาด", data);
  return;
}

if (data.user.length === 0) {
  showLoading(false);
  setStatus("❌ ไม่พบข้อมูลผู้ใช้งาน<br><small>กรุณาตรวจสอบรหัสอีกครั้ง</small>", "warning");
  // logEvent("ไม่พบข้อมูลผู้ใช้งาน", { id });
  return;
}


    data.user.forEach(u=>saveUserToLocalStorage(u));
    const user = data.user?.[0];

    // logEvent("Login Success", {
    //   id,
    //   name: user?.name || "Unknown",
    //   office: user?.office || "Unknown"
    // });

    setTimeout(()=>location.href="index.html",1200);

  }catch(e){
    showLoading(false);
    setStatus("เกิดข้อผิดพลาด","danger");
    // logEvent("Error",{id,error:e.message});
  }
}

// ✅ ฟังก์ชันเริ่มต้นสแกน QR Code
function startScanner() {
  // ปิด scanner เดิมถ้ามี
  if (html5QrcodeScanner) {
    html5QrcodeScanner.stop().catch(console.error);
    html5QrcodeScanner = null;
  }

  // แสดง Modal
  const modal = new bootstrap.Modal(document.getElementById('qrScannerModal'));
  modal.show();

  // รอให้ modal แสดงเสร็จแล้วค่อย initialize scanner (ต้องมี div#reader พร้อม)
  setTimeout(() => {
    const readerElement = document.getElementById('reader');
    if (!readerElement) return;

    // สร้าง instance ใหม่
    html5QrcodeScanner = new Html5Qrcode("reader");

    const qrConfig = {
      fps: 10,
      qrbox: { width: 250, height: 250 },
      aspectRatio: 1.0
    };

    // เริ่มสแกนผ่านกล้องหลัง (ถ้ามี) หรือกล้องหน้า
    html5QrcodeScanner.start(
      { facingMode: "environment" }, // ใช้กล้องหลัง
      qrConfig,
      (decodedText) => {
        // เมื่อสแกนเจอ
        handleQrScan(decodedText);
      },
      (errorMessage) => {
        // แสดงข้อความ error (ไม่ต้องแสดงทุกครั้ง)
        document.getElementById('scanMessage').innerText = 'ปรับกล้อง...';
      }
    ).catch((err) => {
      console.error("Scanner start error", err);
      document.getElementById('scanMessage').innerText = 'ไม่สามารถเปิดกล้องได้';
    });
  }, 500);
}

// ✅ จัดการเมื่อสแกนเจอ QR Code
function handleQrScan(text) {
  // ปิด scanner
  if (html5QrcodeScanner) {
    html5QrcodeScanner.stop().then(() => {
      html5QrcodeScanner = null;
    }).catch(console.error);
  }

  // ปิด modal
  const modalEl = document.getElementById('qrScannerModal');
  const modal = bootstrap.Modal.getInstance(modalEl);
  if (modal) modal.hide();

  // พยายามดึง userId จาก URL ที่สแกนได้
  try {
    const url = new URL(text);
    const userId = url.searchParams.get('userId');
    if (userId && /^\d{6}$/.test(userId)) {
      document.getElementById('userId').value = userId;
      setStatus('สแกนสำเร็จ กำลังเข้าสู่ระบบ...', 'success');

      // ✅ เข้าสู่ระบบอัตโนมัติทันที
      loadData();
    } else {
      setStatus('QR Code ไม่มีรหัสผู้ใช้งานที่ถูกต้อง', 'warning');
    }
  } catch (e) {
    setStatus('รูปแบบ QR Code ไม่ถูกต้อง', 'warning');
  }
}

document.addEventListener("DOMContentLoaded",()=>{
  const uid=getUserIdFromURL();
  if(uid) document.getElementById("userId").value=uid;
});
</script>

</body>
</html>
